description: >-
  FinOps view of Moyasar spend. Moyasar bills per successful transaction as a
  percentage of the processed amount (plus a small fixed fee on card schemes),
  with the rate varying by payment method - mada is cheapest, local Visa /
  Mastercard higher, international cards highest, and wallet methods (Apple Pay,
  STC Pay) at or near their underlying rate. Refunds may carry a small per-refund
  fee. There is no API-call fee and typically no monthly platform fee on the
  standard plan, so cost tracks payment volume and method mix. Settlement is
  net of fees on a rolling schedule (commonly T+2 for SAR).
notes: >-
  Per-method rates are modeled from public secondary sources, not an official
  Moyasar rate card, and are marked reconciled:false. The dominant cost driver
  is gross payment volume weighted by method mix; shifting volume toward mada and
  wallets lowers blended cost. Verify rates and settlement terms against the
  merchant agreement during reconciliation.
