meters:
- name: mada_volume
  description: Value processed on mada, billed as a percentage plus a fixed per-transaction fee.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
- name: scheme_volume
  description: Value processed on Visa / Mastercard / Amex (local and international), billed as a percentage plus a fixed fee; international rate is higher.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
  - region
- name: wallet_volume
  description: Value processed on Apple Pay, Samsung Pay, and STC Pay, billed at or near the underlying card / wallet rate.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
- name: refund_fees
  description: Per-refund fees applied when a payment is refunded.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track gross payment volume and effective fee by method (mada vs scheme vs wallet) and by test vs live mode; reconcile settlements net of fees.
- name: Allocation
  description: Tag payments with metadata (order, team, product) so processing cost maps to internal cost centers.
- name: Optimization
  description: Steer eligible volume toward lower-cost methods (mada, wallets), minimize avoidable refunds, and batch payouts to control disbursement overhead.
- name: Accountability
  description: Assign an owner for payment-processing cost; review monthly blended fee rate and method mix against targets.
