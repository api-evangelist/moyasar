apis:
- aid: moyasar:moyasar-payments-api
  name: Moyasar Payments API
  tags:
  - Payments
  - Cards
  - mada
  - Refunds
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.moyasar.com/api/payments/01-create-payment
