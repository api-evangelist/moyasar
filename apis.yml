aid: moyasar
url: https://raw.githubusercontent.com/api-evangelist/moyasar/refs/heads/main/apis.yml
name: Moyasar
kind: company
description: Moyasar is a Saudi Arabian payment gateway that lets businesses accept
  online payments across mada, Visa, Mastercard, American Express, Apple Pay, Samsung
  Pay, and STC Pay. Its REST API (base https://api.moyasar.com/v1) covers payments
  (create, fetch, list, refund, capture, void), hosted invoices, card tokenization,
  webhooks, and payouts / disbursements. Authentication is HTTP Basic with a publishable
  or secret API key as the username and an empty password, in separate test and live
  modes.
