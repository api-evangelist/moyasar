  description: Create, fetch, and list card / wallet payments and manage their lifecycle -
    refund, capture (for authorized payments), and void. Amounts are in the smallest
    currency unit (halalas for SAR); sources include creditcard, token, applepay,
    samsungpay, and stcpay.
- aid: moyasar:moyasar-invoices-api
