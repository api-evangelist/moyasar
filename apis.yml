    (payment_paid, payment_failed, payment_refunded, payment_captured, payment_voided,
    payment_authorized, and more). Create, list, fetch, and delete webhooks, list
    delivery attempts, and list available event types. Delivery is HTTP POST - there
    is no WebSocket surface.
