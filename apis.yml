    type: Documentation
  - url: openapi/moyasar-openapi.yml
    type: OpenAPI
  - url: collections/moyasar.postman_collection.json
    type: PostmanCollection
  - url: collections/moyasar.opencollection.json
    type: OpenCollection
  description: Register payout accounts (bank or wallet) and send single, listed, or
    bulk payouts / disbursements to those accounts. Create and list payout accounts,
    create single and bulk payouts, and fetch or list individual payouts.
