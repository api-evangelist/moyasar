- aid: moyasar:moyasar-webhooks-api
  name: Moyasar Webhooks API
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.moyasar.com/api/other/webhooks/webhook-reference/
